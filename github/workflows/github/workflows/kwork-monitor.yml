name: Kwork monitor

on:
  schedule:
    - cron: "0 5,15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Проверить новые заказы
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KWORK_CATEGORIES: ${{ vars.KWORK_CATEGORIES }}
        run: python kwork_monitor.py
      - name: Сохранить список увиденных заказов
        run: |
          git config user.name "kwork-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "update seen orders"
          git push
